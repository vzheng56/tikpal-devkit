<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小程序预览</title>
    <style>
      :root {
        --paper: #faf7ef; --card: #fffefa; --sunken: #f2efe7; --line: #e5e6dd; --ink: #282d29; --ink2: #646b62; --ink3: #979d93;
        --coral: #d66e55; --coral-soft: #f8e4dc; --coral-text: #a8492f; --sage: #a6b49b; --sage-strong: #5e7255; --sage-soft: #e8ede1;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #121613; --card: #1f2521; --sunken: #171c19; --line: rgba(250, 247, 239, 0.1); --ink: #faf7ef; --ink2: #a5aa9e; --ink3: #737a70;
          --coral: #df795d; --coral-soft: rgba(223, 121, 93, 0.16); --coral-text: #ee9a80; --sage: #9fb38c; --sage-strong: #b9caa8; --sage-soft: rgba(159, 179, 140, 0.16);
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
      body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; display: flex; gap: 24px; padding: 20px; min-height: 100vh; }
      .stage { flex: none; display: flex; align-items: flex-start; justify-content: center; }
      .phone { position: relative; width: 393px; height: min(820px, calc(100vh - 40px)); border-radius: 36px; overflow: hidden; background: #000; box-shadow: 0 0 0 10px #1d211e, 0 16px 40px rgba(0, 0, 0, 0.25); transition: width 0.2s; }
      .phone iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
      .status { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; padding: 0 28px; font-weight: 600; font-size: 15px; pointer-events: none; color: #111; }
      .phone.dark .status { color: #f5f5f0; }
      .capsule { position: absolute; right: 12px; height: 32px; width: 87px; display: flex; align-items: center; border-radius: 16px; background: rgba(255, 255, 255, 0.72); box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.14); backdrop-filter: blur(10px); }
      .phone.dark .capsule { background: rgba(30, 34, 31, 0.72); box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.18); }
      .capsule button { flex: 1; height: 100%; border: 0; background: none; font: 600 14px/1 system-ui; color: #222; cursor: pointer; }
      .phone.dark .capsule button { color: #eee; }
      .capsule i { width: 0.5px; height: 18px; background: rgba(0, 0, 0, 0.18); }
      .phone.dark .capsule i { background: rgba(255, 255, 255, 0.25); }
      .home { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: rgba(0, 0, 0, 0.35); pointer-events: none; }
      .phone.dark .home { background: rgba(255, 255, 255, 0.45); }
      .phone.android .home { width: 108px; margin-left: -54px; height: 4px; }
      .toast { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; background: rgba(30, 34, 31, 0.9); color: #fff; font-size: 13px; white-space: nowrap; }
      .closed { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--paper); color: var(--ink2); }
      [hidden] { display: none !important; }
      .panel { flex: 1; min-width: 300px; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
      .panel header { display: flex; align-items: baseline; gap: 8px; }
      .panel header b { font-size: 17px; }
      .panel header small { color: var(--ink3); }
      .controls { display: grid; grid-template-columns: 76px 1fr; gap: 8px 10px; align-items: center; padding: 12px; border-radius: 14px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
      .controls label.k { color: var(--ink2); }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      .seg { display: inline-flex; border-radius: 9px; background: var(--sunken); padding: 2px; }
      .seg button { border: 0; background: none; padding: 4px 10px; border-radius: 7px; font: inherit; color: var(--ink2); cursor: pointer; }
      .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
      .chk { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 9px; background: var(--sunken); cursor: pointer; }
      .chk:has(input:checked) { background: var(--coral-soft); color: var(--coral-text); }
      select { font: inherit; padding: 3px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
      button.act { font: inherit; padding: 5px 12px; border-radius: 9px; border: 0; background: var(--sage-strong); color: #fff; cursor: pointer; }
      .problems { padding: 10px 12px; border-radius: 12px; background: var(--coral-soft); color: var(--coral-text); white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
      .log { display: flex; flex-direction: column; min-height: 0; flex: 1; }
      .log h3 { margin: 0 0 6px; font-size: 13px; color: var(--ink2); display: flex; justify-content: space-between; }
      .log h3 button { border: 0; background: none; color: var(--ink3); cursor: pointer; font: inherit; }
      .log ol { list-style: none; margin: 0; padding: 0; overflow: auto; max-height: 52vh; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
      .log li { padding: 6px 10px; border-bottom: 1px solid var(--line); }
      .log li:last-child { border-bottom: 0; }
      .log summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; list-style: none; }
      .log summary b { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
      .log small { color: var(--ink3); }
      .log .code { color: var(--coral-text); font-weight: 600; }
      .log .ok { color: var(--sage-strong); }
      .log .note { color: var(--coral-text); }
      .log pre { margin: 6px 0 0; max-height: 240px; overflow: auto; font-size: 11.5px; background: var(--sunken); padding: 8px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
      .hint { color: var(--ink3); font-size: 12px; }
      @media (max-width: 900px) { body { flex-direction: column; align-items: center; } .panel { max-width: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="phone" id="phone">
        <iframe id="page" title="小程序"></iframe>
        <div class="status" id="status"><span>9:41</span></div>
        <div class="capsule" id="capsule"><button id="more" type="button" title="胶囊菜单（这一版：关于、固定）">···</button><i></i><button id="close" type="button" title="关闭小程序">✕</button></div>
        <div class="home"></div>
        <div class="toast" id="toast" hidden></div>
        <div class="closed" id="closed" hidden><p>小程序关了</p><button class="act" id="reopen" type="button">重新打开</button></div>
      </div>
    </div>
    <aside class="panel">
      <header><b id="title">小程序预览</b><small id="version"></small></header>
      <div class="problems" id="problems" hidden></div>
      <div class="controls" id="controls"></div>
      <p class="hint">假桥照合同核每一次调用：方法、参数、清单里声明的能力。断网、未登录只影响要连服务器的方法；「拒绝」是 App 不给这项能力。边距是近似值。</p>
      <section class="log">
        <h3><span>调用记录</span><button id="clear" type="button">清空</button></h3>
        <ol id="log"></ol>
      </section>
    </aside>
    <script type="module" src="/__tikpal/shell.js"></script>
  </body>
</html>
