# A colleague's app rebuilt for the review (docs: from-idea-to-store.md 5), on GitHub's machines in ESP-IDF 5.5.5's
# container: the app at the submitted commit with the official kit its devkit/ pins, ./kit build --release and
# ./kit check, the release build uploaded. Tikpal downloads it and signs the image as bytes on its release machine,
# which never builds anyone's code. Run by the kit's maintainers (workflow_dispatch), and by Tikpal's review machine
# (yaykit/scripts/review/worker.py in Tikpal's repository) for the developer platform's submissions.
# The tree as cloned (`source`) is uploaded before anything of the app runs, so the review can check the submitted
# source.tar against it; later steps run the app's own code and cannot change what was uploaded already. The review
# takes nothing from `rebuild` on trust either: it hashes the image itself and makes it again from the ELF.
# This repository is public, and so are its Actions logs and artifacts, while the apps it rebuilds may be private: so
# both artifacts go up sealed for Tikpal's review machine (tools/seal_artifact.py with review/rebuild-seal.pub, the
# public key, both this repository's own at the workflow's commit, never the app's devkit/), and only that machine
# opens them. The build's and kit check's output go into the sealed build, not the log; the log says whether each step
# went through and nothing of the source.
# Apps in a private repository (the colleagues' are under Spatial-Therapy-Inc) are read with this repository's
# APP_READ_TOKEN secret, a fine-grained token with read-only Contents and Metadata. Only the step that clones the app
# has it (the build runs the app's own code), and only that clone and checkout send it, as a header on git's command
# line: never in a URL, .git/config, the log or the artifact. Without it, public repositories clone as before; the kit
# (devkit/) is public and is fetched without it.
name: Rebuild
run-name: Rebuild ${{ inputs.commit }}
on:
  workflow_dispatch:
    inputs:
      repository:
        description: The app's repository (https://github.com/<owner>/<repo>)
        required: true
      commit:
        description: The commit from the submission (40 hex digits)
        required: true
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    timeout-minutes: 40
    env:
      REPO: ${{ inputs.repository }}
      COMMIT: ${{ inputs.commit }}
      # The kit, by its name since 1.4 and by its old one (GitHub forwards it; apps made before keep it in .gitmodules).
      KIT_URL: https://github.com/vzheng56/tikpal-devkit
      KIT_URL_OLD: https://github.com/vzheng56/yaykit-devkit
    steps:
      # The sealing tool and the key from this repository as the workflow runs it, before anything of the app is here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: kit-main
          persist-credentials: false
          sparse-checkout: |
            tools/seal_artifact.py
            review/rebuild-seal.pub
          sparse-checkout-cone-mode: false
      - name: The sealing tool, and the review machine's key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /build/seal /build/sealed /build/logs
          cp "$GITHUB_WORKSPACE/kit-main/tools/seal_artifact.py" "$GITHUB_WORKSPACE/kit-main/review/rebuild-seal.pub" /build/seal/
          # ESP-IDF's Python has `cryptography` (esptool needs it); export.sh is not written for set -u
          cat >/build/seal/seal.sh <<'SH'
          set +u
          . "$IDF_PATH/export.sh" >/dev/null 2>&1
          exec python3 /build/seal/seal_artifact.py /build/seal/rebuild-seal.pub "$1" "$2"
          SH
          # nothing goes up unsealed: no key, no rebuild
          head -c 16 /dev/urandom >/build/seal/probe
          bash /build/seal/seal.sh /build/seal/probe /build/seal/probe.sealed >/dev/null 2>&1 || { echo "::error::review/rebuild-seal.pub is not the review machine's key: nothing is rebuilt until it is"; exit 1; }
          rm /build/seal/probe /build/seal/probe.sealed
      - name: The app at that commit, with the official kit at a version
        shell: bash
        env:
          APP_TOKEN: ${{ secrets.APP_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$REPO" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::repository is https://github.com/<owner>/<repo>"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit is 40 hex digits"; exit 1; }
          git config --global --add safe.directory '*'
          mkdir -p /build
          app_git() {
            if [ -n "${APP_TOKEN:-}" ]; then
              git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')" "$@"
            else
              git "$@"
            fi
          }
          app_git clone --quiet --no-checkout "$REPO" /build/app
          app_git -C /build/app -c advice.detachedHead=false checkout --quiet "$COMMIT"
          unset APP_TOKEN
          url=$(git -C /build/app config -f .gitmodules submodule.devkit.url || true)
          [ "${url%.git}" = "$KIT_URL" ] || [ "${url%.git}" = "$KIT_URL_OLD" ] || { echo "::error::devkit/ is $url, not $KIT_URL"; exit 1; }
          git -C /build/app submodule --quiet update --init devkit
          git -C /build/app/devkit fetch --quiet --tags origin
          git -C /build/app/devkit describe --tags --exact-match >/build/kit-tag
          mkdir -p /build/source
          git -C /build/app ls-tree -r -z HEAD >/build/source/tree.txt
          tar -C /build/source -cf /build/source.tar tree.txt
          bash /build/seal/seal.sh /build/source.tar /build/sealed/source.sealed
          echo "source list: sealed"
      # Before the build: nothing of the app has run yet.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source
          path: /build/sealed/source.sealed
          retention-days: 30
      - name: Release build and ./kit check (the app builds at /build/app, which pack-firmware.ts maps back)
        shell: bash
        run: |
          set -uo pipefail
          cd /build/app
          # what the build and the check say goes into the sealed build, not into this public log
          build=0
          ./kit build --release >/build/logs/build.txt 2>&1 || build=$?
          check=skipped
          if [ "$build" = 0 ]; then
            check=0
            ./kit check >build-release/kit-check.txt 2>&1 || check=$?
            bin=$(python3 -c 'import json; print(json.load(open("build-release/project_description.json"))["app_bin"])')
            sha=$(sha256sum "build-release/$bin" | cut -d' ' -f1)
            printf '{"repository":"%s","commit":"%s","devkit":{"tag":"%s","commit":"%s"},"container":"espressif/idf:v5.5.5","image":{"file":"%s","size":%s,"sha256":"%s"}}\n' \
              "$REPO" "$COMMIT" "$(cat /build/kit-tag)" "$(git -C devkit rev-parse HEAD)" "$bin" "$(wc -c <"build-release/$bin")" "$sha" \
              >build-release/rebuild.json
          fi
          echo "$build" >/build/build-status
          echo "$check" >/build/check-status
          # only whether it went through and how many: what the compiler said (paths, code in a warning) stays sealed
          errors=$(grep -c ': error:' /build/logs/build.txt || true)
          warnings=$(grep -c ': warning:' /build/logs/build.txt || true)
          echo "build: $([ "$build" = 0 ] && echo done || echo failed), ${errors:-0} errors, ${warnings:-0} warnings"
          if [ "$check" = skipped ]; then echo "kit check: not run (the build did not go through)"
          elif [ "$check" = 0 ]; then echo "kit check: passed"
          else echo "kit check: failed, $(grep -c '^✗ ' build-release/kit-check.txt || true) checks did not pass"; fi
      - name: The build sealed (what pack-firmware.ts reads, the ELF, map and build.ninja the review checks, both outputs)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p /build/out /build/app/build-release
          cd /build/app/build-release
          for f in rebuild.json project_description.json flasher_args.json sdkconfig kit-check.txt build.ninja *.elf *.map *.bin \
                   bootloader/bootloader.bin partition_table/partition-table.bin yk_voice_code.txt; do
            [ -f "$f" ] && mkdir -p "/build/out/$(dirname "$f")" && cp "$f" "/build/out/$f"
          done
          [ -f /build/logs/build.txt ] && cp /build/logs/build.txt /build/out/build-log.txt
          (cd /build/out && find . -type f | sed 's|^\./||' | sort >/build/out-files)
          # compressed before it is sealed: sealed, nothing compresses it (GitHub's zip neither); the ELF and map shrink
          # about 10 times with xz, and the review machine's line downloads at ~50 KB/s (62 MB took ~21 minutes, 11-10).
          # The machine's tarfile reads xz as it reads a plain tar.
          XZ_OPT=-6T0 tar -C /build/out -cJf /build/rebuild.tar -T /build/out-files
          bash /build/seal/seal.sh /build/rebuild.tar /build/sealed/rebuild.sealed
          echo "build: sealed ($(wc -l </build/out-files) files)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rebuild
          path: /build/sealed/rebuild.sealed
          if-no-files-found: ignore
          retention-days: 30
      - name: The build and the check went through
        shell: bash
        run: |
          [ "$(cat /build/build-status)" = 0 ] && [ "$(cat /build/check-status)" = 0 ] || { echo "::error::the build or kit check did not pass (what they said is in the sealed build)"; exit 1; }
